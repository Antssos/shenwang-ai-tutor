name: wangxueban
services:
  app:
    image: ${APP_IMAGE:?Set an immutable application image reference}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  app_data:
