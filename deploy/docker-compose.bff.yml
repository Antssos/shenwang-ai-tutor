name: wangxueban

services:
  bff:
    build:
      context: ../worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wangxueban_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  tunnel:
    image: cloudflare/cloudflared:2026.7.3-amd64
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://bff:3000
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      bff:
        condition: service_healthy

volumes:
  wangxueban_data:
